version: '3.8'

# Services
services:
    nginx:
        build: 
            dockerfile: ./deployment/local/nginx/nginx.dockerfile
        container_name: sacos-nginx-frontend
        ports:
            - 8080:80
        volumes:
            - './deployment/local/nginx/conf.d:/etc/nginx/conf.d'
            - './logs/nginx/:/var/log/nginx'
            - './:/var/www/html'
        networks: 
            - backend        
networks:
    backend:
        driver: bridge